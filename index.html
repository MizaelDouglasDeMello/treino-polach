function ic(nome,classe){
  return '<svg class="bi '+(classe||"")+'" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">'+ICONES[nome]+'</svg>';
}

const elVoltar=document.getElementById("voltar");
const elTitulo=document.getElementById("titulo");
const elTag=document.getElementById("tag");
const elTema=document.getElementById("tema");
const elRail=document.getElementById("rail");
const elNote=document.getElementById("note");
const elConteudo=document.getElementById("conteudo");
const elRodape=document.getElementById("rodape");

let planoAtual=null;

/* ---------- tema claro / escuro ---------- */
const TEMA="treinos-tema";
function lerTema(){try{return localStorage.getItem(TEMA)}catch(e){return null}}
function salvarTema(t){try{localStorage.setItem(TEMA,t)}catch(e){}}
function aplicarTema(t){
  document.documentElement.setAttribute("data-bs-theme",t);
  elTema.innerHTML=ic(t==="dark"?"sun-fill":"moon-stars-fill");
  elTema.setAttribute("aria-label",t==="dark"?"Usar tema claro":"Usar tema escuro");
  const m=document.querySelector('meta[name="theme-color"]');
  if(m) m.setAttribute("content",t==="dark"?"#212529":"#ffffff");
}
const midia=window.matchMedia("(prefers-color-scheme: light)");
aplicarTema(lerTema()||(midia.matches?"light":"dark"));
midia.addEventListener("change",e=>{if(!lerTema()) aplicarTema(e.matches?"light":"dark")});
elTema.addEventListener("click",()=>{
  const t=document.documentElement.getAttribute("data-bs-theme")==="dark"?"light":"dark";
  salvarTema(t); aplicarTema(t);
});

/* ---------- home ---------- */
function home(){
  planoAtual=null;
  elVoltar.hidden=true; elRail.hidden=true; elNote.hidden=true;
  elTitulo.textContent="Treinos";
  elTag.textContent=""; elTag.className="badge rounded-pill d-none flex-shrink-0";
  elRodape.textContent="Escolha a planilha que você vai usar.";
  elConteudo.innerHTML='<p class="text-uppercase text-body-secondary fw-semibold tracking mt-4 mb-3" style="font-size:.72rem">Planilhas disponíveis</p>';

  Object.keys(PLANOS).forEach(k=>{
    const p=PLANOS[k];
    const letras=Object.keys(p.treinos);
    const rotulo=/^\d+$/.test(letras[0])?"Dias":"Treinos";
    const b=document.createElement("button");
    b.type="button";
    b.className="plano card border-0 shadow-sm w-100 mb-3";
    b.innerHTML=
      '<div class="card-body d-flex align-items-center gap-3">'+
        '<div class="flex-grow-1 min-w-0">'+
          '<h2 class="h5 fw-semibold mb-1">'+p.nome+'</h2>'+
          '<p class="text-body-secondary small mb-2">'+p.resumo+'</p>'+
          '<span class="badge text-bg-primary me-1">'+p.freq+'</span>'+
          '<span class="badge bg-body-secondary text-body-secondary">'+rotulo+' '+letras.join(", ")+'</span>'+
        '</div>'+
        ic("chevron-right","text-body-secondary fs-5")+
      '</div>';
    b.addEventListener("click",()=>abrirPlano(k));
    elConteudo.appendChild(b);
  });
  window.scrollTo({top:0});
}

/* ---------- abre uma planilha ---------- */
function abrirPlano(k){
  planoAtual=k;
  const p=PLANOS[k];
  elVoltar.hidden=false;
  elTitulo.textContent=p.nome;
  elRail.hidden=false; elRail.innerHTML="";
  elRodape.textContent="Toque numa série para marcar como feita. As marcações somem ao trocar de treino.";

  Object.keys(p.treinos).forEach(t=>{
    const b=document.createElement("button");
    b.type="button"; b.setAttribute("role","tab"); b.dataset.t=t;
    b.className="dia btn btn-outline-secondary flex-shrink-0";
    b.innerHTML='<span class="d-block fw-bold fs-5 lh-1">'+t+'</span>'+
                '<span class="d-block text-uppercase tracking opacity-75" style="font-size:.62rem">'+p.treinos[t].dia+'</span>';
    b.addEventListener("click",()=>selecionar(t));
    elRail.appendChild(b);
  });

  const hoje=new Date().getDay();
  const doDia=p.semana[hoje];
  elTag.textContent=doDia?"Hoje":"Descanso";
  elTag.className="badge rounded-pill flex-shrink-0 "+(doDia?"text-bg-success":"bg-body-secondary text-body-secondary");
  elNote.hidden=!!doDia;
  if(!doDia) elNote.textContent="Nesta planilha, hoje é descanso. Escolha um treino acima se quiser adiantar.";

  selecionar(doDia||Object.keys(p.treinos)[0]);
}

/* ---------- monta um treino ---------- */
function selecionar(t){
  const p=PLANOS[planoAtual];
  [...elRail.children].forEach(b=>{
    const on=b.dataset.t===t;
    b.setAttribute("aria-selected",String(on));
    b.className="dia btn flex-shrink-0 "+(on?"btn-primary":"btn-outline-secondary");
  });
  elConteudo.innerHTML="";

  p.treinos[t].ex.forEach((e,idx)=>{
    const busca=e.n.replace(/ ou .*$/,"").replace(/ \+ .*$/,"");
    const id="subs-"+idx;
    const el=document.createElement("div");
    el.className="card border-0 shadow-sm mb-3";
    el.innerHTML=`
      <div class="card-body">
        <div class="d-flex gap-3">
          <span class="idx badge text-bg-primary rounded-3 fs-6">${idx+1}</span>
          <div class="min-w-0">
            <h3 class="h6 fw-semibold mb-1">${e.n}</h3>
            ${e.t!=="—"?`<p class="text-body-secondary small mb-2">${e.t}</p>`:""}
            ${e.i!=="—"?`<span class="badge rounded-pill bg-primary-subtle text-primary-emphasis">${ic("stopwatch","me-1")}Intervalo ${e.i}</span>`:""}
          </div>
        </div>

        <div class="d-flex flex-wrap gap-2 mt-3">
          ${e.s.map(s=>`<button class="set btn btn-outline-primary btn-sm flex-grow-1 fw-semibold" type="button" aria-pressed="false">${s}</button>`).join("")}
        </div>

        <div class="d-grid gap-2 mt-2">
          <button class="swap acao btn btn-outline-danger btn-sm" type="button"
                  data-bs-toggle="collapse" data-bs-target="#${id}" aria-expanded="false" aria-controls="${id}">
            ${ic("arrow-repeat","me-1")}Máquina ocupada
          </button>
          <div class="d-flex gap-2">
            <a class="acao btn btn-outline-secondary btn-sm flex-fill d-inline-flex align-items-center justify-content-center"
               href="${IG+encodeURIComponent(busca+" execução")}" target="_blank" rel="noopener">
              ${ic("instagram","me-1")}Instagram
            </a>
            <a class="acao btn btn-outline-secondary btn-sm flex-fill d-inline-flex align-items-center justify-content-center"
               href="${YT+encodeURIComponent(busca+" execução correta")}" target="_blank" rel="noopener">
              ${ic("youtube","me-1")}YouTube
            </a>
          </div>
        </div>

        <div class="collapse" id="${id}">
          <div class="mt-3 p-3 rounded-3 bg-body-tertiary border-start border-3 border-danger-subtle">
            <p class="text-uppercase text-body-secondary fw-semibold tracking mb-2" style="font-size:.68rem">Substituições que mantêm o estímulo</p>
            <ul class="list-unstyled mb-0 small">
              ${e.alt.map(a=>`<li class="d-flex gap-2 mb-2">${ic("check2","text-danger-emphasis mt-1")}<span>${a}</span></li>`).join("")}
            </ul>
          </div>
        </div>
      </div>`;

    el.querySelectorAll(".set").forEach(btn=>{
      btn.addEventListener("click",()=>{
        const on=btn.getAttribute("aria-pressed")!=="true";
        btn.setAttribute("aria-pressed",String(on));
        btn.classList.toggle("active",on);
      });
    });

    const swap=el.querySelector(".swap"), col=el.querySelector(".collapse");
    col.addEventListener("show.bs.collapse",()=>{
      swap.classList.replace("btn-outline-danger","btn-danger");
      swap.innerHTML=ic("x-lg","me-1")+"Fechar substituições";
    });
    col.addEventListener("hide.bs.collapse",()=>{
      swap.classList.replace("btn-danger","btn-outline-danger");
      swap.innerHTML=ic("arrow-repeat","me-1")+"Máquina ocupada";
    });

    elConteudo.appendChild(el);
  });
  window.scrollTo({top:0});
}

elVoltar.innerHTML=ic("chevron-left","me-1")+"Voltar";
elVoltar.addEventListener("click",home);
home();
</script>
</body>
</html>
