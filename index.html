<style>
  /* Apenas o que o Bootstrap nao cobre: safe area do iPhone, toque e o trilho de dias. */
  *{-webkit-tap-highlight-color:transparent}
  button,a{touch-action:manipulation}
  button{-webkit-user-select:none;user-select:none}
  html,body{overscroll-behavior-y:none}
  body{
    -webkit-text-size-adjust:100%;text-size-adjust:100%;
    -webkit-font-smoothing:antialiased;
  }
  .container-narrow{max-width:600px;margin-inline:auto}

  header{padding-top:env(safe-area-inset-top)}
  footer{padding-bottom:calc(1.5rem + env(safe-area-inset-bottom))}

  .rail{
    display:flex;gap:.5rem;overflow-x:auto;scrollbar-width:none;
    -webkit-overflow-scrolling:touch;scroll-snap-type:x proximity;
  }
  .rail::-webkit-scrollbar{display:none}
  .dia{min-width:68px;padding:.45rem .5rem;scroll-snap-align:center;line-height:1.2}

  /* card clicavel da home */
  button.plano,button.exlink{padding:0;text-align:left;font:inherit;color:inherit}

  /* alvos de toque confortaveis no celular */
  .set,.acao{min-height:44px}
  .idx{width:2rem;height:2rem;display:grid;place-items:center;flex:0 0 auto}
  .min-w-0{min-width:0}
  .tracking{letter-spacing:.08em}

  /* calendario */
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
  .cal-cabeca div{text-align:center;font-size:.66rem;font-weight:700;letter-spacing:.06em;
                  color:var(--bs-secondary-color);text-transform:uppercase}
  .cal-dia{aspect-ratio:1;display:grid;place-items:center;border-radius:9px;
           font-size:.8rem;font-weight:600;border:1px solid var(--bs-border-color);
           background:var(--bs-body-bg);color:var(--bs-body-color);padding:0}
  .cal-dia.vazio{visibility:hidden}
  .cal-dia:disabled{opacity:1}
  .cal-dia.futuro{opacity:.3}
  .cal-dia.feito{background:var(--bs-primary);border-color:var(--bs-primary);color:#fff}
  .cal-dia.hoje{box-shadow:0 0 0 2px var(--bs-primary)}
  .cal-dia.aberto{outline:2px solid var(--bs-primary);outline-offset:1px}
  .graf-peso{display:block;width:100%;height:auto;color:var(--bs-body-color)}
  .bi{width:1em;height:1em;vertical-align:-.125em;flex:0 0 auto}

  /* series e carga, lado a lado em uma linha por serie */
  .serie{display:flex;gap:.5rem}
  .serie .set{flex:1 1 auto}
  /* largura fixa: input solto tem largura natural de ~20 caracteres e quebra o flex */
  .carga{flex:0 0 84px;width:84px}
  .carga,.campo{font-size:16px;padding:.25rem .4rem}  /* <16px faz o iOS dar zoom ao focar */  /* <16px faz o iOS dar zoom ao focar */

  /* cronometro de intervalo */
  .crono{min-height:36px}
  #cronometro{padding-bottom:env(safe-area-inset-bottom)}
  body.com-crono{padding-bottom:6rem}
  #cronoTempo{font-variant-numeric:tabular-nums;min-width:4.2ch;text-align:right}

  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.01ms !important;transition-duration:.01ms !important}
  }
</style>

/* O Instagram nao tem busca por palavra aberta: /explore/search/keyword responde
   302 para o login e o app abre a busca vazia, sem o termo. Pagina de hashtag e a
   unica rota que o app entende, entao o nome do exercicio vira uma tag. */
const IG_STOP = ["de","do","da","dos","das","com","em","no","na","nos","nas",
                 "e","ou","a","o","os","as","para","sem","ao","aos"];
function tagIG(nome){
  const tag = String(nome)
    .normalize("NFD").replace(/[̀-ͯ]/g,"")   // tira acento: ç->c, ã->a
    .toLowerCase().replace(/[^a-z0-9\s]/g," ")
    .split(/\s+/).filter(w=>w && IG_STOP.indexOf(w)===-1)
    .slice(0,2).join("");
  return "https://www.instagram.com/explore/tags/"+encodeURIComponent(tag||"treino")+"/";
}
function linkYT(nome){
  return YT+encodeURIComponent(nome+" execução correta");
}

const elVoltar=document.getElementById("voltar");
const elTitulo=document.getElementById("titulo");

let planoAtual=null, treinoAtual=null, exAtual=null;
let nivel="home";          // home | treino | exercicio
let voltandoPara=0;        // rolagem a recuperar ao sair de um exercicio
let restaurando=false;     // true enquanto o popstate remonta a tela

/* Cada tela vira uma entrada no historico, para o gesto de voltar do iOS subir
   um nivel em vez de sair do app. A URL nao muda: o estado vai no proprio
   history.state, entao recarregar continua caindo na home.
   modo "replace" para movimento lateral (trocar de dia, andar entre
   exercicios), que nao merece uma entrada nova. */
/* O navegador restaura rolagem sozinho no popstate, mas aqui o conteudo e
   remontado depois do evento: quando ele tenta, a lista ainda nem existe. Melhor
   assumir o controle e deixar voltandoPara como unica fonte. */
if("scrollRestoration" in history) history.scrollRestoration="manual";

function historiar(estado,modo){
  if(restaurando) return;
  if(!history.state || modo==="replace") history.replaceState(estado,"");
  else history.pushState(estado,"");
}

/* ---------- progresso do dia e historico de carga ----------
   sessao: o que foi marcado e a carga usada hoje, por plano|treino|exercicio.
   historico: as ultimas 8 sessoes de cada exercicio, indexadas pelo nome, porque
   a carga do supino e a mesma esteja ele em que planilha estiver.
   Virou o dia: o que ficou na sessao vai para o historico e o dia comeca limpo. */
const K_SESSAO="treinos-sessao", K_HIST="treinos-historico";

function leJSON(k,padrao){
  try{ const v=localStorage.getItem(k); return v?JSON.parse(v):padrao; }catch(err){ return padrao; }
}
function gravaJSON(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(err){} }

function dataHoje(){
  const d=new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}

let historico=leJSON(K_HIST,{});
let sessao=leJSON(K_SESSAO,null);

function arquivarSessao(s){
  if(!s||!s.dia||!s.carga) return;
  Object.keys(s.carga).forEach(ch=>{
    const cargas=s.carga[ch]||[];
    if(!cargas.some(c=>c)) return;                 // nada digitado, nao vale registro
    const nome=ch.split("|").slice(2).join("|");
    const lista=historico[nome]=historico[nome]||[];
    lista.unshift({d:s.dia,c:cargas});
    historico[nome]=lista.slice(0,8);
  });
  gravaJSON(K_HIST,historico);
}

if(!sessao||sessao.dia!==dataHoje()){
  arquivarSessao(sessao);
  sessao={dia:dataHoje(),feito:{},carga:{},exFeito:{}};
  gravaJSON(K_SESSAO,sessao);
}

function chaveEx(nome){ return planoAtual+"|"+treinoAtual+"|"+nome; }

/* Ajustes do usuario por exercicio: series, repeticoes e descanso. Valem sobre
   o que a planilha prescreve e nao expiram com o dia, diferente da sessao. */
const K_AJUSTES="treinos-ajustes";
let ajustes=leJSON(K_AJUSTES,{});

function ajusteDe(nome){ return ajustes[chaveEx(nome)]||null; }

function gravarAjuste(nome,dados){
  const ch=chaveEx(nome);
  if(dados) ajustes[ch]=dados; else delete ajustes[ch];
  gravaJSON(K_AJUSTES,ajustes);
}

/* segundos -> "90 s" / "2 min", para caber no mesmo formato da planilha */
function intervaloTexto(seg){
  return (seg>=60 && seg%60===0) ? (seg/60)+" min" : seg+" s";
}

/* "4x 6-10" quer dizer quatro series, mas como uma entrada so virava uma linha
   e um campo de carga, sem progressao. Aqui cada serie vira uma linha propria.
   "1x 15-20" continua valendo uma, entao as planilhas em piramide nao mudam. */
function expandirSeries(e){
  const aj=ajusteDe(e.n);
  if(aj && aj.series) return Array.from({length:aj.series},()=>aj.reps||"");
  const fora=[];
  (e.s||[]).forEach(txt=>{
    const m=String(txt).match(/^\s*(\d+)\s*x\s*(.+)$/i);
    if(m){
      const n=parseInt(m[1],10), reps=m[2].trim();
      for(let i=0;i<n;i++) fora.push(reps);
    }else{
      fora.push(String(txt).trim());
    }
  });
  return fora;
}

/* o intervalo mostrado na lista tem de seguir o ajuste, igual ao resumo */
function intervaloResumo(e){
  const aj=ajusteDe(e.n);
  if(aj && aj.descanso) return intervaloTexto(aj.descanso);
  return e.i!=="—" ? e.i : "";
}

function resumoSeries(e){
  const l=expandirSeries(e);
  if(!l.length) return "";
  if(l.length===1) return l[0];                       // serie unica ou cardio
  return l.every(r=>r===l[0]) ? l.length+"x "+l[0] : l.length+" séries";
}

function ultimaCarga(nome){
  const lista=historico[nome];
  if(!lista||!lista.length) return "";
  const cargas=(lista[0].c||[]).filter(c=>c);
  if(!cargas.length) return "";
  const p=String(lista[0].d).split("-");
  return cargas.join(" · ")+" kg · "+p[2]+"/"+p[1];
}

function limparTreino(){
  const pref=planoAtual+"|"+treinoAtual+"|";
  [sessao.feito,sessao.carga,sessao.exFeito||{}].forEach(obj=>{
    Object.keys(obj).forEach(k=>{ if(k.indexOf(pref)===0) delete obj[k]; });
  });
  removerTreino(planoAtual,treinoAtual);
  gravaJSON(K_SESSAO,sessao);
  selecionar(treinoAtual,"replace");
}

/* ---------- cronometro de intervalo ---------- */
const elCrono=document.getElementById("cronometro");
const elCronoNome=document.getElementById("cronoNome");
const elCronoTempo=document.getElementById("cronoTempo");
const elCronoBarra=document.getElementById("cronoBarra");
const elCronoMais=document.getElementById("cronoMais");
const elCronoParar=document.getElementById("cronoParar");

/* "45 s", "2 min", "1 a 2 min" (usa o menor), "30 s / 90 s" (dois botoes) */
function duracoes(txt){
  return String(txt).split("/").map(p=>p.trim()).filter(Boolean).map(p=>{
    const nums=p.match(/\d+/g);
    if(!nums) return null;
    const n=parseInt(nums[0],10);
    return {seg:/min/i.test(p)?n*60:n, rotulo:p};
  }).filter(Boolean);
}

function cronoBotoes(e){
  const aj=ajusteDe(e.n);
  if(aj && aj.descanso){
    const t=intervaloTexto(aj.descanso);
    return `<div class="d-flex flex-wrap gap-2"><button type="button" class="crono btn btn-sm rounded-pill bg-primary-subtle text-primary-emphasis border-0 fw-semibold"
             data-seg="${aj.descanso}" data-nome="${e.n.replace(/"/g,"&quot;")}">${ic("stopwatch","me-1")}Intervalo ${t}</button></div>`;
  }
  if(e.i==="—") return "";
  const ds=duracoes(e.i);
  if(!ds.length) return `<span class="badge rounded-pill bg-primary-subtle text-primary-emphasis">${ic("stopwatch","me-1")}Intervalo ${e.i}</span>`;
  const nome=e.n.replace(/"/g,"&quot;");
  return `<div class="d-flex flex-wrap gap-2">`+ds.map(d=>
    `<button type="button" class="crono btn btn-sm rounded-pill bg-primary-subtle text-primary-emphasis border-0 fw-semibold"
             data-seg="${d.seg}" data-nome="${nome}">${ic("stopwatch","me-1")}${ds.length>1?d.rotulo:"Intervalo "+d.rotulo}</button>`
  ).join("")+`</div>`;
}

/* ---------- diario de treinos, no estilo de app de habito ----------
   sessao.exFeito guarda os exercicios concluidos hoje, e some com o dia.
   diario guarda os treinos concluidos por data, e nao some nunca: e ele que
   alimenta o calendario e a sequencia. */
const K_DIARIO="treinos-diario";
let diario=leJSON(K_DIARIO,{});

function chaveData(d){
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}

function chaveDe(plano,treino,nome){ return plano+"|"+treino+"|"+nome; }

function exConcluido(plano,treino,nome){
  return !!(sessao.exFeito||{})[chaveDe(plano,treino,nome)];
}

function marcarExercicio(plano,treino,nome,on){
  sessao.exFeito=sessao.exFeito||{};
  const ch=chaveDe(plano,treino,nome);
  if(on) sessao.exFeito[ch]=true; else delete sessao.exFeito[ch];
  gravaJSON(K_SESSAO,sessao);
  sincronizarTreino(plano,treino);
}

function quantosConcluidos(plano,treino){
  return PLANOS[plano].treinos[treino].ex
    .filter(e=>exConcluido(plano,treino,e.n)).length;
}

function treinoNoDiario(plano,treino,data){
  return (diario[data||dataHoje()]||[]).some(r=>r.plano===plano&&r.treino===treino);
}

function registrarTreino(plano,treino){
  const hoje=dataHoje();
  if(treinoNoDiario(plano,treino,hoje)) return;
  const lista=diario[hoje]=diario[hoje]||[];
  lista.push({plano:plano,treino:treino,nome:PLANOS[plano].nome,
              exercicios:PLANOS[plano].treinos[treino].ex.length,
              em:new Date().toISOString()});
  gravaJSON(K_DIARIO,diario);
}

function removerTreino(plano,treino){
  const hoje=dataHoje();
  const lista=diario[hoje]||[];
  const i=lista.findIndex(r=>r.plano===plano&&r.treino===treino);
  if(i<0) return;
  lista.splice(i,1);
  if(!lista.length) delete diario[hoje];
  gravaJSON(K_DIARIO,diario);
}

/* concluir todos os exercicios fecha o treino sozinho; desfazer um reabre */
function sincronizarTreino(plano,treino){
  const total=PLANOS[plano].treinos[treino].ex.length;
  if(quantosConcluidos(plano,treino)===total) registrarTreino(plano,treino);
  else removerTreino(plano,treino);
}

/* ---------- sequencia e contagens ---------- */
function sequenciaAtual(){
  const d=new Date();
  // sem treino hoje ainda, a sequencia conta a partir de ontem, para nao zerar
  // no meio do dia so porque a pessoa ainda nao treinou
  if(!diario[chaveData(d)]) d.setDate(d.getDate()-1);
  let n=0;
  while(diario[chaveData(d)]){ n++; d.setDate(d.getDate()-1); }
  return n;
}

function treinosNoMes(ano,mes){
  return Object.keys(diario).filter(k=>{
    const p=k.split("-");
    return +p[0]===ano && +p[1]===mes+1;
  }).reduce((n,k)=>n+diario[k].length,0);
}

function totalDeTreinos(){
  return Object.values(diario).reduce((n,l)=>n+l.length,0);
}

          ic("check-circle-fill","text-success")+
          '<span>'+r.nome+' · treino '+r.treino+'</span></li>').join("")+
      '</ul></div>'
    : "";

  elConteudo.innerHTML=
    '<div class="row g-2 mt-3 mb-3">'+
      '<div class="col-4"><div class="card border-0 shadow-sm h-100"><div class="card-body text-center py-3">'+
        '<div class="fs-4 fw-bold lh-1">'+seq+'</div>'+
        '<div class="text-body-secondary" style="font-size:.7rem">'+(seq===1?"dia seguido":"dias seguidos")+'</div>'+
      '</div></div></div>'+
      '<div class="col-4"><div class="card border-0 shadow-sm h-100"><div class="card-body text-center py-3">'+
        '<div class="fs-4 fw-bold lh-1">'+doMes+'</div>'+
        '<div class="text-body-secondary" style="font-size:.7rem">no mês</div>'+
      '</div></div></div>'+
      '<div class="col-4"><div class="card border-0 shadow-sm h-100"><div class="card-body text-center py-3">'+
        '<div class="fs-4 fw-bold lh-1">'+totalDeTreinos()+'</div>'+
        '<div class="text-body-secondary" style="font-size:.7rem">no total</div>'+
      '</div></div></div>'+
    '</div>'+

    '<div class="card border-0 shadow-sm mb-3"><div class="card-body">'+
      '<div class="d-flex align-items-center gap-2 mb-3">'+
        '<button class="btn btn-sm btn-outline-secondary" type="button" id="calAntes" aria-label="Mês anterior">'+ic("chevron-left")+'</button>'+
        '<div class="flex-grow-1 text-center fw-semibold">'+MESES[calMes]+' de '+calAno+'</div>'+
        '<button class="btn btn-sm btn-outline-secondary" type="button" id="calDepois" aria-label="Próximo mês">'+ic("chevron-right")+'</button>'+

/* ---------- peso corporal ----------
   Uma medida por data, a ultima do dia vence. O grafico e SVG desenhado aqui
   mesmo: biblioteca de grafico custaria mais que o app inteiro e quebraria o
   funcionamento sem sinal. */
const K_PESO="treinos-peso";
let pesos=leJSON(K_PESO,{});

function listaDePesos(){
  return Object.keys(pesos).sort().map(d=>({d:d,kg:pesos[d]}));
}

function lerPeso(texto){
  const n=parseFloat(String(texto).replace(",","."));
  return (isFinite(n) && n>=30 && n<=300) ? Math.round(n*10)/10 : null;
}

function registrarPeso(data,kg){
  pesos[data]=kg;
  gravaJSON(K_PESO,pesos);
}

function apagarPeso(data){
  delete pesos[data];
  gravaJSON(K_PESO,pesos);
}

/* variacao desde N dias atras, ou desde o primeiro registro quando dias e nulo */
function variacaoPeso(dias){
  const l=listaDePesos();
  if(l.length<2) return null;
  const ultimo=l[l.length-1];
  let base=l[0];
  if(dias){
    const limite=new Date();
    limite.setDate(limite.getDate()-dias);
    const ch=chaveData(limite);
    const antigos=l.filter(p=>p.d<=ch);
    base = antigos.length ? antigos[antigos.length-1] : l[0];
  }
  if(base.d===ultimo.d) return null;
  return {de:base, para:ultimo, dif:ultimo.kg-base.kg};
}

function diaMes(d){ const p=String(d).split("-"); return p[2]+"/"+p[1]; }

function graficoPeso(){
  const todos=listaDePesos();
  const l=todos.slice(-90);                  // mais que isso vira borrao no celular
  if(l.length<2){
    return '<p class="text-body-secondary small mb-0">'+
      (l.length ? "Um registro só. Anote de novo daqui a alguns dias e a linha aparece."
                : "Sem registro ainda. Anote seu peso para começar a acompanhar.")+'</p>';
  }

  const L=34, R=8, T=10, B=20, W=320, H=150;     // margens e area do desenho
  const pw=W-L-R, ph=H-T-B;

  const tempos=l.map(p=>new Date(p.d+"T12:00:00").getTime());
  const tMin=Math.min.apply(null,tempos), tMax=Math.max.apply(null,tempos);
  const kgs=l.map(p=>p.kg);
  let kMin=Math.min.apply(null,kgs), kMax=Math.max.apply(null,kgs);
  if(kMax===kMin){ kMin-=1; kMax+=1; }          // linha reta nao pode virar divisao por zero
  const folga=(kMax-kMin)*0.15;
  kMin-=folga; kMax+=folga;

  const x=i=>L+(tMax===tMin?pw/2:(tempos[i]-tMin)/(tMax-tMin)*pw);
  const y=kg=>T+(kMax-kg)/(kMax-kMin)*ph;

  const pontos=l.map((p,i)=>[x(i),y(p.kg)]);
  const linha=pontos.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const area=linha+" L"+pontos[pontos.length-1][0].toFixed(1)+" "+(T+ph)+
             " L"+pontos[0][0].toFixed(1)+" "+(T+ph)+" Z";

  const bolinhas = l.length<=30
    ? pontos.map(p=>'<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+
        '" r="2.5" fill="var(--bs-primary)"/>').join("")
    : '<circle cx="'+pontos[pontos.length-1][0].toFixed(1)+'" cy="'+pontos[pontos.length-1][1].toFixed(1)+
      '" r="3" fill="var(--bs-primary)"/>';

  const topo=Math.max.apply(null,kgs), base=Math.min.apply(null,kgs);

  return '<svg viewBox="0 0 '+W+' '+H+'" class="graf-peso" role="img" '+
    'aria-label="Evolução do peso, de '+formataKg(l[0].kg)+' a '+formataKg(l[l.length-1].kg)+' quilos">'+
    '<defs><linearGradient id="gradPeso" x1="0" y1="0" x2="0" y2="1">'+
      '<stop offset="0%" stop-color="var(--bs-primary)" stop-opacity=".28"/>'+
      '<stop offset="100%" stop-color="var(--bs-primary)" stop-opacity="0"/>'+
    '</linearGradient></defs>'+
    '<line x1="'+L+'" y1="'+y(topo).toFixed(1)+'" x2="'+(W-R)+'" y2="'+y(topo).toFixed(1)+
      '" stroke="currentColor" stroke-opacity=".18" stroke-dasharray="3 3"/>'+
    '<line x1="'+L+'" y1="'+y(base).toFixed(1)+'" x2="'+(W-R)+'" y2="'+y(base).toFixed(1)+
      '" stroke="currentColor" stroke-opacity=".18" stroke-dasharray="3 3"/>'+
    '<path d="'+area+'" fill="url(#gradPeso)"/>'+
    '<path d="'+linha+'" fill="none" stroke="var(--bs-primary)" stroke-width="2" '+
      'stroke-linejoin="round" stroke-linecap="round"/>'+
    bolinhas+
    '<text x="'+(L-5)+'" y="'+(y(topo)+3).toFixed(1)+'" text-anchor="end" font-size="9" '+
      'fill="currentColor" opacity=".6">'+formataKg(topo)+'</text>'+
    '<text x="'+(L-5)+'" y="'+(y(base)+3).toFixed(1)+'" text-anchor="end" font-size="9" '+
      'fill="currentColor" opacity=".6">'+formataKg(base)+'</text>'+
    '<text x="'+L+'" y="'+(H-6)+'" font-size="9" fill="currentColor" opacity=".6">'+diaMes(l[0].d)+'</text>'+
    '<text x="'+(W-R)+'" y="'+(H-6)+'" text-anchor="end" font-size="9" fill="currentColor" '+
      'opacity=".6">'+diaMes(l[l.length-1].d)+'</text>'+
  '</svg>';
}

function blocoPeso(){
  const l=listaDePesos();
  const atual=l.length?l[l.length-1]:null;
  const desdeOInicio=variacaoPeso(null);
  const em30=variacaoPeso(30);
  const hoje=dataHoje();

  /* sem verde nem amarelo de proposito: perder peso e bom para quem esta em
     deficit e ruim para quem esta em recomposicao, e o app nao sabe qual e o
     caso. Mostra a direcao e o numero, sem julgar. */
  const selo=v=>{
    if(!v) return "";
    const seta=v.dif<0?"↓":v.dif>0?"↑":"→";
    const sinal=v.dif>0?"+":"";
    return '<span class="badge rounded-pill bg-body-secondary text-body-emphasis">'+
      seta+" "+sinal+formataKg(v.dif)+' kg</span>';
  };

  return '<div class="card border-0 shadow-sm mb-3"><div class="card-body">'+
    '<div class="d-flex align-items-baseline gap-2 mb-1">'+
      '<p class="text-uppercase text-body-secondary fw-semibold tracking mb-0 flex-grow-1" style="font-size:.68rem">Peso corporal</p>'+
      (atual?'<span class="fs-5 fw-bold">'+formataKg(atual.kg)+' kg</span>':"")+
    '</div>'+
    (atual?'<p class="text-body-secondary mb-2" style="font-size:.72rem">medido em '+diaMes(atual.d)+'</p>':"")+

    (desdeOInicio||em30
      ? '<div class="d-flex flex-wrap gap-2 mb-3">'+
        (em30?'<span class="d-inline-flex align-items-center gap-1" style="font-size:.74rem">'+
              selo(em30)+'<span class="text-body-secondary">em 30 dias</span></span>':"")+
        (desdeOInicio?'<span class="d-inline-flex align-items-center gap-1" style="font-size:.74rem">'+
              selo(desdeOInicio)+'<span class="text-body-secondary">desde '+diaMes(desdeOInicio.de.d)+'</span></span>':"")+
        '</div>'
      : '<div class="mb-3"></div>')+

    graficoPeso()+

    '<div class="d-flex gap-2 mt-3">'+
      '<input class="form-control form-control-sm campo" id="pesoValor" type="text" inputmode="decimal" '+
        'enterkeyhint="done" placeholder="kg" value="'+(pesos[hoje]!==undefined?formataKg(pesos[hoje]):"")+'" '+
        'aria-label="Seu peso hoje, em quilos">'+
      '<button class="btn btn-primary btn-sm flex-shrink-0" type="button" id="pesoSalvar">Anotar hoje</button>'+
    '</div>'+
    (pesos[hoje]!==undefined
      ? '<button class="btn btn-sm btn-link p-0 mt-2" type="button" id="pesoApagar">Apagar o registro de hoje</button>'
      : "")+
  '</div></div>';
}

function ligarPeso(){
  const bt=document.getElementById("pesoSalvar");
  if(!bt) return;
  bt.addEventListener("click",()=>{
    const kg=lerPeso(document.getElementById("pesoValor").value);
    if(kg===null) return alert("Escreva um peso entre 30 e 300 kg, por exemplo 82,5.");
    registrarPeso(dataHoje(),kg);
    desenharCalendario();
  });
  const apagar=document.getElementById("pesoApagar");
  if(apagar) apagar.addEventListener("click",()=>{
    apagarPeso(dataHoje());
    desenharCalendario();
  });
}

/* ---------- apito ligado / desligado ---------- */
const elSom=document.getElementById("som");
const SOM="treinos-som";
let somLigado=true;
try{ somLigado=localStorage.getItem(SOM)!=="off"; }catch(err){}

function aplicarSom(){
  elSom.innerHTML=ic(somLigado?"volume-up-fill":"volume-mute-fill");
  elSom.setAttribute("aria-label",somLigado?"Desligar o apito":"Ligar o apito");
  elSom.classList.toggle("btn-outline-secondary",somLigado);
  elSom.classList.toggle("btn-outline-danger",!somLigado);
}
elSom.addEventListener("click",()=>{
  somLigado=!somLigado;
  try{ localStorage.setItem(SOM,somLigado?"on":"off"); }catch(err){}
  aplicarSom();
  if(somLigado) bip();   // confirma que voltou, e o toque libera o audio no iOS
});
aplicarSom();

let audio=null;
function bip(){
  if(!somLigado) return;
  try{
    audio=audio||new (window.AudioContext||window.webkitAudioContext)();
    if(audio.state==="suspended") audio.resume();
    [0,.25,.5].forEach(t=>{
      const o=audio.createOscillator(), g=audio.createGain();
      o.type="sine"; o.frequency.value=880;
      o.connect(g); g.connect(audio.destination);
      const t0=audio.currentTime+t;
      g.gain.setValueAtTime(.0001,t0);
      g.gain.exponentialRampToValueAtTime(.3,t0+.02);
      g.gain.exponentialRampToValueAtTime(.0001,t0+.18);
      o.start(t0); o.stop(t0+.2);
    });
  }catch(err){}
}

/* Mantem a tela acesa durante o descanso, que e quando ninguem toca no celular
   e ele apaga bem na hora de olhar quanto falta. So durante a contagem: segurar
   o treino inteiro gastaria bateria a toa. iOS 16.4 em diante; onde nao existe,
   nada acontece. */
let travaTela=null;

async function segurarTela(){
  try{
    if(!("wakeLock" in navigator) || travaTela) return;
    travaTela=await navigator.wakeLock.request("screen");
    travaTela.addEventListener("release",()=>{ travaTela=null; });
  }catch(err){ travaTela=null; }   // aba oculta, bateria baixa, navegador sem suporte
}

async function soltarTela(){
  try{ if(travaTela) await travaTela.release(); }catch(err){}
  travaTela=null;
}

let cronoFim=0, cronoTotal=0, cronoTick=null, cronoSumir=null;

// o sistema solta a trava sozinho quando o app sai da frente; retoma se o descanso continua
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="visible" && cronoTick) segurarTela();
});

function mmss(s){
  s=Math.max(0,s);
  return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
}

function passoCrono(){
  // usa relogio real: o iOS congela timers com a tela apagada
  const resta=Math.ceil((cronoFim-Date.now())/1000);
  elCronoBarra.style.width=Math.max(0,Math.min(100,resta/cronoTotal*100))+"%";
  if(resta>0){ elCronoTempo.textContent=mmss(resta); return; }

  clearInterval(cronoTick); cronoTick=null;
  elCronoTempo.textContent="Pode ir";
  elCronoTempo.classList.add("text-success");
  elCronoBarra.classList.add("bg-success");
  elCronoBarra.style.width="100%";
  bip();
  if(navigator.vibrate){ try{ navigator.vibrate([200,100,200]); }catch(err){} }
  cronoSumir=setTimeout(()=>{ if(!cronoTick) pararCrono(); },10000);
}

function iniciarCrono(seg,nome){
  // o toque que inicia e o gesto que libera o audio no iOS
  try{ audio=audio||new (window.AudioContext||window.webkitAudioContext)(); audio.resume(); }catch(err){}
  clearTimeout(cronoSumir); if(cronoTick) clearInterval(cronoTick);
  cronoTotal=seg; cronoFim=Date.now()+seg*1000;
  elCronoNome.textContent=nome;
  elCronoTempo.classList.remove("text-success");
  elCronoBarra.classList.remove("bg-success");
  elCrono.hidden=false; document.body.classList.add("com-crono");
  segurarTela();
  cronoTick=setInterval(passoCrono,200);
  passoCrono();
}

function pararCrono(){
  clearTimeout(cronoSumir);
  if(cronoTick) clearInterval(cronoTick);
  cronoTick=null;
  soltarTela();
  elCrono.hidden=true;
  document.body.classList.remove("com-crono");
}

elCronoParar.innerHTML=ic("x-lg");
elCronoParar.addEventListener("click",pararCrono);
elCronoMais.addEventListener("click",()=>{
  clearTimeout(cronoSumir);
  cronoFim=Math.max(cronoFim,Date.now())+30000;
  cronoTotal+=30;
  elCronoTempo.classList.remove("text-success");
  elCronoBarra.classList.remove("bg-success");
  if(!cronoTick) cronoTick=setInterval(passoCrono,200);
  segurarTela();
  passoCrono();
});

/* ---------- progressao de carga ---------- */
function numeroCarga(v){
  const n=parseFloat(String(v).replace(",","."));
  return isFinite(n)?n:0;
}
function maiorCarga(c){ return (c||[]).reduce((m,v)=>Math.max(m,numeroCarga(v)),0); }
function formataKg(n){ return String(Math.round(n*100)/100).replace(".",","); }

function blocoProgressao(nome){
  const lista=historico[nome]||[];       // mais recente primeiro
  if(!lista.length){
    return '<p class="text-body-secondary small mb-0">Ainda sem registro. '+
           'Anote a carga de hoje e ela aparece aqui a partir do próximo treino.</p>';
  }

  let tendencia="";
  if(lista.length>1){
    const agora=maiorCarga(lista[0].c), antes=maiorCarga(lista[1].c);
    if(agora&&antes){
      const dif=agora-antes;
      const txt=dif>0?"subiu "+formataKg(dif)+" kg":dif<0?"caiu "+formataKg(-dif)+" kg":"manteve a carga";
      const cor=dif>0?"text-bg-success":dif<0?"text-bg-warning":"bg-body-secondary text-body-secondary";
      tendencia='<span class="badge rounded-pill '+cor+' mb-3">'+txt+' desde a vez anterior</span>';
    }
  }

  const topo=lista.reduce((m,r)=>Math.max(m,maiorCarga(r.c)),0)||1;
  const linhas=lista.map(r=>{
    const pct=Math.max(6,Math.round(maiorCarga(r.c)/topo*100));
    const d=String(r.d).split("-");
    const kg=(r.c||[]).filter(x=>x).join(" · ");
    return '<div class="mb-2">'+
      '<div class="d-flex justify-content-between small">'+
        '<span class="text-body-secondary">'+d[2]+"/"+d[1]+'</span>'+
        '<span class="fw-semibold">'+kg+' kg</span>'+
      '</div>'+
      '<div class="progress mt-1" style="height:6px">'+
        '<div class="progress-bar" style="width:'+pct+'%"></div>'+
      '</div></div>';
  }).join("");

  return tendencia+linhas;
}

/* ---------- rodape do treino ---------- */
function rodapeTreino(){
  const total=PLANOS[planoAtual].treinos[treinoAtual].ex.length;
  const prontos=quantosConcluidos(planoAtual,treinoAtual);
  const fechado=treinoNoDiario(planoAtual,treinoAtual);
  elRodape.innerHTML=
    (fechado
      ? '<span class="badge rounded-pill text-bg-success mb-2">'+ic("check-circle-fill","me-1")+'Treino concluído hoje</span><br>'
      : '<span class="text-body-secondary">'+prontos+' de '+total+' exercícios concluídos</span><br>')+
    '<button class="btn btn-sm btn-link p-0 mt-1" id="limpar" type="button">Limpar este treino</button>';
  document.getElementById("limpar").addEventListener("click",limparTreino);
}

/* ---------- backup ---------- */
function coletarBackup(){
  return {
    app:"treinos", versao:1, exportadoEm:new Date().toISOString(),
    sessao:leJSON(K_SESSAO,null),
    historico:leJSON(K_HIST,{}),
    ajustes:leJSON(K_AJUSTES,{}),
    diario:leJSON(K_DIARIO,{}),
    pesos:leJSON(K_PESO,{})
  };
}

function exportarBackup(){
  const nome="treinos-backup-"+dataHoje()+".json";
  const blob=new Blob([JSON.stringify(coletarBackup(),null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url; a.download=nome;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

/* Junta em vez de substituir: restaurar um backup antigo nao pode apagar o que
   foi registrado depois. Mesma data do mesmo exercicio conta como o mesmo treino. */
function importarBackup(dados){
  if(!dados||dados.app!=="treinos"||typeof dados.historico!=="object") throw new Error("formato");
  let novos=0;
  Object.keys(dados.historico).forEach(nome=>{
    const vindos=Array.isArray(dados.historico[nome])?dados.historico[nome]:[];
    const atuais=historico[nome]||[];
    const dias=new Set(atuais.map(r=>r.d));
    vindos.forEach(r=>{ if(r&&r.d&&!dias.has(r.d)){ atuais.push(r); dias.add(r.d); novos++; } });
    historico[nome]=atuais.sort((a,b)=>String(b.d).localeCompare(String(a.d))).slice(0,8);
  });
  gravaJSON(K_HIST,historico);

  // pesos do backup entram sem apagar medida ja registrada na mesma data
  if(dados.pesos&&typeof dados.pesos==="object"){
    Object.keys(dados.pesos).forEach(d=>{ if(pesos[d]===undefined) pesos[d]=dados.pesos[d]; });
    gravaJSON(K_PESO,pesos);
  }

  // dias do backup entram sem apagar os que ja existem aqui
  if(dados.diario&&typeof dados.diario==="object"){
    Object.keys(dados.diario).forEach(d=>{ if(!diario[d]) diario[d]=dados.diario[d]; });
    gravaJSON(K_DIARIO,diario);
  }

  // ajustes do backup nao sobrescrevem os daqui, que sao mais recentes
  if(dados.ajustes&&typeof dados.ajustes==="object"){
    Object.keys(dados.ajustes).forEach(ch=>{ if(!ajustes[ch]) ajustes[ch]=dados.ajustes[ch]; });
    gravaJSON(K_AJUSTES,ajustes);
  }

  // a sessao so volta se for do mesmo dia; a de ontem ja virou historico
  if(dados.sessao&&dados.sessao.dia===dataHoje()){
    sessao=dados.sessao; gravaJSON(K_SESSAO,sessao);
  }
  return novos;
}

function limparODia(){
  const marcas=Object.keys(sessao.feito||{}).length;
  const cargas=Object.keys(sessao.carga||{}).length;
  if(!marcas && !cargas) return;
  if(!confirm("Isso apaga as marcações e as cargas digitadas hoje, em todas as planilhas. "+
              "O histórico dos treinos anteriores não é tocado. Continuar?")) return;
  sessao={dia:dataHoje(),feito:{},carga:{},exFeito:{}};
  gravaJSON(K_SESSAO,sessao);
  delete diario[dataHoje()];
  gravaJSON(K_DIARIO,diario);
  home();
}

function blocoHoje(){
  const exercicios=new Set(Object.keys(sessao.feito||{}).concat(Object.keys(sessao.carga||{})));
  if(!exercicios.size) return "";
  const n=exercicios.size;
  return '<div class="mt-4 pt-3 border-top">'+
    '<p class="text-uppercase text-body-secondary fw-semibold tracking mb-2" style="font-size:.72rem">Hoje</p>'+
    '<p class="text-body-secondary small">'+n+(n>1?" exercícios com":" exercício com")+
    ' marcação ou carga anotada hoje.</p>'+
    '<button class="btn btn-outline-danger btn-sm w-100" id="limparHoje" type="button">'+
      'Limpar tudo de hoje</button></div>';
}

function blocoBackup(){
  const exercicios=Object.keys(historico).length;
  const registros=Object.values(historico).reduce((n,l)=>n+l.length,0);
  const resumo=exercicios
    ? exercicios+(exercicios>1?" exercícios":" exercício")+" com carga registrada, "+
      registros+(registros>1?" sessões":" sessão")+"."
    : "Nenhuma carga registrada ainda.";
  return '<div class="mt-4 pt-3 border-top">'+
    '<p class="text-uppercase text-body-secondary fw-semibold tracking mb-2" style="font-size:.72rem">Backup</p>'+
    '<p class="text-body-secondary small">'+resumo+
    ' O histórico fica só neste aparelho e o Safari pode apagá-lo. Guarde uma cópia de vez em quando.</p>'+
    '<div class="d-flex gap-2">'+
      '<button class="btn btn-outline-secondary btn-sm flex-fill" id="exportar" type="button">Exportar</button>'+
      '<label class="btn btn-outline-secondary btn-sm flex-fill mb-0" for="importar">Importar</label>'+
      '<input type="file" id="importar" accept="application/json,.json" class="d-none">'+
    '</div></div>';
}

function ligarBackup(){
  document.getElementById("exportar").addEventListener("click",exportarBackup);
  document.getElementById("importar").addEventListener("change",ev=>{
    const arq=ev.target.files&&ev.target.files[0];
    if(!arq) return;
    const leitor=new FileReader();
    leitor.onload=()=>{
      try{
        const dados=JSON.parse(leitor.result);
        const novos=importarBackup(dados);
        alert(novos?("Backup restaurado: "+novos+" sessão(ões) acrescentada(s)."):
                     "Backup lido. Nada de novo para acrescentar.");
        home();
      }catch(err){ alert("Não consegui ler esse arquivo. Ele precisa ser um backup exportado por este app."); }
    };
    leitor.onerror=()=>alert("Não consegui ler o arquivo.");
    leitor.readAsText(arq);
    ev.target.value="";
  });
}

/* ---------- service worker: abrir sem sinal ---------- */
if("serviceWorker" in navigator && location.protocol!=="file:"){
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  });
}

elVoltar.innerHTML=ic("chevron-left","me-1")+"Voltar";
/* O botao Voltar delega ao historico, entao ele e o gesto do iOS percorrem o
   mesmo caminho. Sem entrada anterior (app aberto direto num nivel), cai no
   passo a passo manual. */
elVoltar.addEventListener("click",()=>{
  if(history.state && history.state.nivel!=="home") history.back();
  else if(nivel==="exercicio") selecionar(treinoAtual,"replace");
  else home();
});

window.addEventListener("popstate",ev=>{
  const e=ev.state||{nivel:"home"};
  restaurando=true;
  try{
    if(e.nivel==="calendario"){
      abrirCalendario();
    }else if(e.nivel!=="home" && PLANOS[e.plano] && PLANOS[e.plano].treinos[e.treino]){
      abrirPlano(e.plano);
      selecionar(e.treino);
      if(e.nivel==="exercicio" && PLANOS[e.plano].treinos[e.treino].ex[e.ex]) abrirExercicio(e.ex);
    }else{
      home();
    }
  }finally{ restaurando=false; }
});
home();
</script>
