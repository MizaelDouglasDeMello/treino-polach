<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15171B">
<title>Treinos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#15171B; --surface:#1C1F24; --line:#2C313A;
    --text:#E9E6DF; --muted:#8A9099;
    --brass:#D2A63C; --rust:#C2603F; --radius:4px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%;
    padding-bottom:48px;
  }
  h1,h2,h3,b{font-family:"Archivo",system-ui,sans-serif}
  [hidden]{display:none !important}

  header{
    position:sticky;top:0;z-index:10;background:var(--bg);
    border-bottom:1px solid var(--line);padding:env(safe-area-inset-top) 0 0;
  }
  .brand{display:flex;align-items:center;gap:12px;padding:14px 16px 10px}
  .brand h1{font-size:21px;font-weight:800;letter-spacing:-.02em;margin:0;flex:1}
  .brand .tag{color:var(--muted);font-size:13px}
  .back{
    background:transparent;border:1px solid var(--line);border-radius:var(--radius);
    color:var(--text);font:inherit;font-size:14px;padding:6px 11px;cursor:pointer;
  }
  .back:focus-visible,.day:focus-visible,.set:focus-visible,.btn:focus-visible,.plano:focus-visible{
    outline:2px solid var(--brass);outline-offset:2px;
  }

  .rail{display:flex;gap:6px;overflow-x:auto;padding:0 16px 12px;scrollbar-width:none}
  .rail::-webkit-scrollbar{display:none}
  .day{
    flex:1 0 auto;min-width:62px;background:var(--surface);
    border:1px solid var(--line);border-radius:var(--radius);
    color:var(--muted);padding:8px 6px 7px;font:inherit;text-align:center;cursor:pointer;
  }
  .day b{display:block;font-size:19px;font-weight:800;color:var(--text)}
  .day small{font-size:11px;letter-spacing:.04em}
  .day[aria-selected="true"]{background:var(--brass);border-color:var(--brass);color:#2A2205}
  .day[aria-selected="true"] b{color:#221B04}

  main{padding:0 16px}
  .intro{color:var(--muted);font-size:14px;margin:18px 0 6px}

  .plano{
    display:block;width:100%;text-align:left;cursor:pointer;
    background:transparent;border:0;border-bottom:1px solid var(--line);
    border-left:3px solid var(--brass);
    padding:18px 0 18px 14px;margin:0;font:inherit;color:var(--text);
  }
  .plano h2{font-size:19px;font-weight:600;margin:0}
  .plano p{margin:5px 0 0;color:var(--muted);font-size:14px}

  .today-note{color:var(--muted);font-size:13px;padding:12px 0 0;margin:0}
  .ex{border-bottom:1px solid var(--line);padding:20px 0 18px}
  .ex-head{display:flex;gap:12px;align-items:flex-start}
  .idx{
    flex:0 0 26px;height:26px;margin-top:2px;display:grid;place-items:center;
    border:1px solid var(--brass);color:var(--brass);
    font-family:"Archivo",sans-serif;font-weight:800;font-size:13px;border-radius:var(--radius);
  }
  .ex h3{font-size:18px;font-weight:600;line-height:1.25;margin:0}
  .tech{opacity:.75;font-size:14px;margin:6px 0 0}
  .rest{color:var(--brass);font-size:13px;margin:4px 0 0}

  .sets{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 0 38px}
  .set{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    color:var(--text);font:inherit;font-size:13px;padding:7px 10px;cursor:pointer;
  }
  .set[aria-pressed="true"]{
    background:transparent;border-color:var(--brass);color:var(--brass);
    text-decoration:line-through;text-decoration-color:var(--brass);
  }

  .actions{display:flex;gap:6px;margin:12px 0 0 38px;flex-wrap:wrap}
  .btn{
    background:transparent;border:1px solid var(--line);border-radius:var(--radius);
    color:var(--text);font:inherit;font-size:13px;padding:8px 11px;cursor:pointer;
    display:inline-flex;align-items:center;gap:7px;text-decoration:none;
  }
  .btn.swap{border-color:var(--rust);color:var(--rust)}
  .btn.swap[aria-expanded="true"]{background:var(--rust);color:#1A0D09}
  .btn svg{width:15px;height:15px;flex:0 0 auto}

  .subs{margin:10px 0 0 38px;padding:12px 14px;background:var(--surface);border-left:2px solid var(--rust)}
  .subs p{margin:0 0 8px;font-size:12px;color:var(--muted)}
  .subs ul{margin:0;padding-left:18px}
  .subs li{margin:0 0 5px;font-size:14px}
  .subs li:last-child{margin:0}

  footer{padding:24px 16px;color:var(--muted);font-size:12px}
</style>
</head>
<body>

  <div class="brand">
    <button class="back" id="voltar" type="button" hidden>Voltar</button>

    <span class="tag" id="tag"></span>
  </div>
  <div class="rail" role="tablist" aria-label="Dias de treino" id="rail" hidden></div>
</header>

  <p class="today-note" id="note" hidden></p>
  <div id="conteudo"></div>
</main>

const elVoltar=document.getElementById("voltar");
const elTitulo=document.getElementById("titulo");
const elTag=document.getElementById("tag");
const elRail=document.getElementById("rail");
const elNote=document.getElementById("note");
const elConteudo=document.getElementById("conteudo");
const elRodape=document.getElementById("rodape");

let planoAtual=null;

function icone(tipo){
  if(tipo==="ig") return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>';
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="4"/><path d="M10 9.5l5 2.5-5 2.5z" fill="currentColor" stroke="none"/></svg>';
}

function home(){
  planoAtual=null;
  elVoltar.hidden=true; elRail.hidden=true; elNote.hidden=true;
  elTitulo.textContent="Treinos"; elTag.textContent="";
  elRodape.textContent="Escolha a planilha que você vai usar.";
  elConteudo.innerHTML='<p class="intro">Quatro planilhas disponíveis.</p>';
  Object.keys(PLANOS).forEach(k=>{
    const p=PLANOS[k];
    const letras=Object.keys(p.treinos);
    const b=document.createElement("button");
    b.className="plano"; b.type="button";
    const rotulo=/^\d+$/.test(letras[0])?"Dias":"Treinos";
    b.innerHTML=`<h2>${p.nome}</h2><p>${p.resumo}</p><p>${rotulo} ${letras.join(", ")}</p>`;
    b.addEventListener("click",()=>abrirPlano(k));
    elConteudo.appendChild(b);
  });
  window.scrollTo({top:0});
}

function abrirPlano(k){
  planoAtual=k;
  const p=PLANOS[k];
  elVoltar.hidden=false;
  elTitulo.textContent=p.nome;
  elRail.hidden=false; elRail.innerHTML="";
  elRodape.textContent="Toque numa série para marcar como feita. As marcações somem ao trocar de treino.";

  Object.keys(p.treinos).forEach(t=>{
    const b=document.createElement("button");
    b.className="day"; b.type="button"; b.setAttribute("role","tab"); b.dataset.t=t;
    b.innerHTML=`<b>${t}</b><small>${p.treinos[t].dia}</small>`;
    b.addEventListener("click",()=>selecionar(t));
    elRail.appendChild(b);
  });

  const hoje=new Date().getDay();
  const doDia=p.semana[hoje];
  elTag.textContent=doDia?"hoje":"descanso";
  elNote.hidden=!!doDia;
  if(!doDia) elNote.textContent="Nesta planilha, hoje é descanso. Escolha um treino acima se quiser adiantar.";

  selecionar(doDia||Object.keys(p.treinos)[0]);
}

function selecionar(t){
  const p=PLANOS[planoAtual];
  [...elRail.children].forEach(b=>b.setAttribute("aria-selected",String(b.dataset.t===t)));
  elConteudo.innerHTML="";

  p.treinos[t].ex.forEach((e,idx)=>{
    const busca=e.n.replace(/ ou .*$/,"").replace(/ \+ .*$/,"");
    const el=document.createElement("article");
    el.className="ex";
    el.innerHTML=`
      <div class="ex-head">
        <span class="idx">${idx+1}</span>
        <div>
          <h3>${e.n}</h3>
          ${e.t!=="—"?`<p class="tech">${e.t}</p>`:""}
          ${e.i!=="—"?`<p class="rest">Intervalo: ${e.i}</p>`:""}
        </div>
      </div>
      <div class="sets">${e.s.map(s=>`<button class="set" type="button" aria-pressed="false">${s}</button>`).join("")}</div>
      <div class="actions">
        <button class="btn swap" type="button" aria-expanded="false">Máquina ocupada</button>
        <a class="btn" href="${IG+encodeURIComponent(busca+" execução")}" target="_blank" rel="noopener">${icone("ig")}Instagram</a>
        <a class="btn" href="${YT+encodeURIComponent(busca+" execução correta")}" target="_blank" rel="noopener">${icone("yt")}YouTube</a>
      </div>
      <div class="subs" hidden>
        <p>Substituições que mantêm o estímulo</p>
        <ul>${e.alt.map(a=>`<li>${a}</li>`).join("")}</ul>
      </div>`;

    el.querySelectorAll(".set").forEach(btn=>{
      btn.addEventListener("click",()=>{
        btn.setAttribute("aria-pressed",btn.getAttribute("aria-pressed")==="true"?"false":"true");
      });
    });

    const swap=el.querySelector(".swap"), subs=el.querySelector(".subs");
    swap.addEventListener("click",()=>{
      const aberto=swap.getAttribute("aria-expanded")==="true";
      swap.setAttribute("aria-expanded",String(!aberto));
      subs.hidden=aberto;
      swap.textContent=aberto?"Máquina ocupada":"Fechar substituições";
    });

    elConteudo.appendChild(el);
  });
  window.scrollTo({top:0});
}

elVoltar.addEventListener("click",home);
home();
</script>
</body>
</html>
